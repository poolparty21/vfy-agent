name = "vfy-agent"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

# D1 holds the replay seen-set, the answer cache (idempotent retries) and the
# Steal the VFY turn log. D1 rather than KV: the replay check needs strong
# consistency, or two tasks with the same proof_tx could both be answered as
# the first use.
[[d1_databases]]
binding = "DB"
database_name = "vfy-agent"
database_id = "3e45bef3-3b81-4f44-8e61-b3961fae49b4"

[vars]
# The path the platform POSTs tasks to. The dashboard wants the FULL handler
# path, not just the root domain.
AGENT_PATH = "/agent"

# Which reason_code vocabulary to send.
#   "canonical" (default) -> VALID_PROOF, PROOF_REPLAY, PUBLIC_INPUT_MISMATCH
#                            (the rules page's "Canonical reason codes" table,
#                            which says: "Use these as your reason_code values
#                            in Proof Gatekeeper responses")
#   "trap"                -> VALID_CONDITION, PROOF_REUSED, EXPIRED_CONDITION,
#                            RECIPIENT_MISMATCH, AMOUNT_OVERFLOW
#                            (the event page's trap labels, which the live arena
#                            screen renders)
# The canonical list is the documented answer for the `reason_code` FIELD; the
# trap table is descriptive, and the arena rendering it is the platform's own
# display. The switch stays as a one-line fallback.
AGENT_REASON_STYLE = "canonical"

# zkVerify mainchain RPC (public, no auth). Used to confirm that a task's
# proof_tx really landed on chain.
ZKVERIFY_RPC = "https://zkverify-rpc.zkverify.io"

# Kurier REST base. The API key is a secret (see below), never a var.
KURIER_API_BASE = "https://api.kurier.xyz/api/v1"

# Public strategy commitment for the Steal the VFY event.
#
# This MUST equal the "commitment hash" registered on the dashboard (Dashboard
# -> My Agents -> Edit agent -> the Steal the VFY section), because the
# platform independently recomputes policyProof.publicInputsHash from the game
# state it knows and rejects any response whose hash diverges.
#
# It is C = keccak256(W || R): W = the policy witness (extractCap and
# version, each a 32-byte big-endian word), R = a private 32-byte salt kept in
# .strategy-salt (gitignored). Regenerate with: node scripts_commit.mjs
#
# The rules allow updating it between rounds, so it can be recomputed once the
# platform publishes the circuit artifacts and the real Hash(W, R) is known.
STRATEGY_COMMITMENT = "0xf5a9f63b77aae9bde37211246d9a923026de3059faf48eef3fdf3a324014e1e2"

# Secrets (set with `wrangler secret put`, never committed):
#   AGENT_GAMES_HMAC_SECRET   - the first agent's secret (kept for the
#                                single-agent case)
#   AGENT_GAMES_HMAC_SECRETS  - comma-separated list, when SEVERAL agents
#                                share this one endpoint. The platform issues a
#                                separate one-time secret per agent, and a
#                                request is signed with whichever agent's
#                                secret it used — the response is signed back
#                                with that same secret.
#   KURIER_API_KEY            - optional, enables live Groth16 verification
